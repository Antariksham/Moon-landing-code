name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build & unit tests (host)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -DCMAKE_BUILD_TYPE=Debug
          -DLLS_BUILD_TESTS=ON -DLLS_BUILD_SIM=ON

      - name: Build (warnings are errors)
        run: cmake --build build -j

      - name: Run unit + closed-loop SIL tests
        run: ctest --test-dir build --output-on-failure

      - name: Fly the nominal 1-DOF terminal descent (exit code is the verdict)
        run: ./build/sim/selene_sim

      - name: Fly the nominal 3-DOF approach + pitch-over (exit code is the verdict)
        run: ./build/sim/selene_sim --mode 3dof

      - name: Monte-Carlo dispersion campaign (every run must land safely)
        run: ./build/sim/selene_sim --mode mc --runs 300

  format:
    name: clang-format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting
        run: |
          sudo apt-get update && sudo apt-get install -y clang-format
          find src include tests -name '*.hpp' -o -name '*.cpp' \
            | xargs clang-format --dry-run --Werror
