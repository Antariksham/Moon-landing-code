# Project SELENE — mission & vehicle parameters (technology demonstrator).
# Values here are PLACEHOLDERS for SIL development, not flight-tuned.
# Any change to this file requires a closed-loop SIL regression run.

mission:
  target_body: moon
  gravity_mps2: 1.625              # Lunar surface gravity
  landing_site:
    latitude_deg: -84.5            # Notional south-pole region site
    longitude_deg: 31.2
    elevation_m: 0.0

vehicle:
  dry_mass_kg: 280.0
  propellant_mass_kg: 320.0
  main_engine:
    # 2500 N keeps min-throttle thrust (750 N) below lunar weight at all
    # vehicle masses, so a steady terminal descent is physically possible.
    # (The earlier 4500 N placeholder violated this: 0.3 * 4500 = 1350 N
    # exceeds the ~975 N lunar weight — the vehicle could never descend at
    # constant rate with the engine lit.)
    max_thrust_n: 2500.0
    min_throttle_frac: 0.30        # Deep-throttle floor
    max_throttle_frac: 1.00
    specific_impulse_s: 310.0

  attitude:
    pitch_inertia_kgm2: 450.0      # Pitch-axis moment of inertia
    max_rcs_torque_nm: 400.0       # RCS couple at command = +/-1

control:
  loop_rate_hz: 50
  descent_rate_pid:                # See src/gnc/control/pid_controller.hpp
    # 1-DOF sim only. The PID outputs a throttle CORRECTION around the
    # mass-feedforward hover throttle (m*g / T_max); the engine model
    # enforces the real [min_throttle, 1.0] band. See sim/src/descent_sim.cpp.
    kp: 0.8
    ki: 0.15
    kd: 0.05
    # +/-0.7 spans the full engine band around hover (~0.36-0.39), so hot
    # gates can command maximum thrust.
    output_min: -0.70
    output_max: 0.70
    integrator_min: -0.20
    integrator_max: 0.20

  # 3-DOF approach loops (see sim/src/approach_sim.cpp). The velocity
  # loops output thrust ACCELERATION commands (m/s^2) that the thrust
  # allocator turns into pitch + throttle; the attitude loop outputs an
  # RCS torque fraction in [-1, 1].
  horizontal_velocity_pid:
    kp: 0.40
    ki: 0.02
    kd: 0.0
    # +/-2.5 m/s^2: enough braking authority to stop a +3 sigma hot gate
    # (75 m/s) inside the nominal 1200 m site range, realizable within
    # the allocator's 60 deg pitch authority.
    output_min: -2.5
    output_max: 2.5
    integrator_min: -0.30
    integrator_max: 0.30
  vertical_velocity_pid:
    # Correction around the gravity feedforward (1.625 m/s^2).
    kp: 1.50
    ki: 0.30
    kd: 0.0
    # +/-2.5 m/s^2 spans the engine's net-acceleration band around hover
    # (max net accel is ~2.9 m/s^2 at full tanks).
    output_min: -2.5
    output_max: 2.5
    integrator_min: -0.50
    integrator_max: 0.50
  attitude_pid:
    # PD design: derivative-on-measurement provides pure rate damping;
    # no integral term (nothing to trim in vacuum flight).
    kp: 5.0
    ki: 0.0
    kd: 4.5
    output_min: -1.0
    output_max: 1.0
    integrator_min: -0.10
    integrator_max: 0.10
  thrust_allocator:                # See src/gnc/control/thrust_allocator.hpp
    # Sized so a hot gate (+3 sigma ground speed) can still brake to the
    # landing site; guidance forces vertical attitude below 150 m anyway.
    max_pitch_deg: 60.0            # Attitude authority for translation loops

navigation:                        # Vertical channel (milestone 3)
  vertical_nav_filter:             # src/gnc/navigation/vertical_nav_filter.hpp
    # 2-state Kalman filter: IMU-acceleration predict at the control
    # rate, radar-altimeter update at the sensor rate. The initial state
    # is seeded from the approach gate plus the handover errors below.
    initial_altitude_std_m: 10.0
    initial_velocity_std_mps: 2.0
    accel_noise_std_mps2: 0.1      # Process noise driver
    altimeter_noise_std_m: 0.2     # Measurement noise (R)
    innovation_gate_sigma: 5.0     # Reject returns beyond this many sigma
  handover_error:                  # Filter seed error vs. truth at the gate
    altitude_m: 5.0
    velocity_mps: 1.0

  # Horizontal channel (milestone 7):
  # src/gnc/navigation/horizontal_nav_filter.hpp — 3-state Kalman filter
  # (downrange, ground speed, accelerometer bias): IMU-acceleration
  # predict at the control rate, TRN position update at the sensor rate.
  # The bias state matters because TRN goes blind below its minimum
  # altitude and the filter must dead-reckon the terminal descent on the
  # IMU alone: an unestimated 0.02 m/s^2 bias would integrate to ~1 m/s
  # of phantom ground speed — most of the touchdown budget.
  horizontal_nav_filter:
    initial_downrange_std_m: 10.0
    initial_velocity_std_mps: 2.0
    initial_bias_std_mps2: 0.05    # Bias state is seeded at zero
    accel_noise_std_mps2: 0.1      # Process noise driver
    bias_walk_std_mps2: 0.001      # Bias random-walk growth per sqrt(s)
    trn_noise_std_m: 5.0           # Measurement noise (R)
    innovation_gate_sigma: 5.0     # Reject fixes beyond this many sigma
  horizontal_handover_error:       # Filter seed error vs. truth at the gate
    downrange_m: 10.0
    velocity_mps: 1.0

  sensors:                         # SIL error models (sim/src/sensor_models.hpp)
    imu_accel_noise_std_mps2: 0.05 # White noise per 50 Hz sample, per axis
    imu_accel_bias_mps2: 0.02      # Constant turn-on bias, per axis
                                   # (vertical: unestimated; horizontal:
                                   # estimated by the flight filter)
    altimeter_noise_std_m: 0.2     # White noise per return
    altimeter_rate_hz: 10          # Return every 5th control cycle
    trn_noise_std_m: 5.0           # White noise per TRN position fix
    trn_rate_hz: 5                 # Fix every 10th control cycle
    trn_min_altitude_m: 100.0      # TRN is blind below this altitude

approach:                          # 3-DOF handover gate (milestone 2)
  gate_altitude_m: 2000.0
  gate_horizontal_velocity_mps: 60.0
  gate_vertical_velocity_mps: -30.0
  gate_pitch_deg: -17.2            # Braking attitude (thrust against travel)
  # Landing site, measured downrange from the gate (milestone 5). Mission
  # design must pick a site the gate energy and the ramp below can reach.
  target_downrange_m: 1200.0
  # Guidance horizontal law (src/gnc/guidance/descent_guidance.hpp): the
  # signed ground-speed command toward the site is the most restrictive
  # of the range braking envelope, the near-field linear law, and the
  # altitude-keyed pitch-over ramp (zero ground speed at/below the
  # pitch-over altitude, forcing a vertical terminal descent).
  pitchover_altitude_m: 150.0
  horizontal_rate_slope_hz: 0.03   # (m/s of ground speed) per m of altitude
  max_horizontal_rate_mps: 80.0
  horizontal_brake_decel_mps2: 0.8 # Range-to-go envelope deceleration
  near_field_gain_hz: 0.2          # (m/s) per m of range inside the envelope

terminal_descent:
  target_descent_rate_mps: 1.0     # Constant-velocity final segment
  touchdown_velocity_limit_mps: 2.0
  touchdown_horizontal_limit_mps: 1.0
  touchdown_tilt_limit_deg: 5.0
  touchdown_miss_limit_m: 50.0     # Site-targeting accuracy criterion
  engine_cutoff_altitude_m: 0.5

monte_carlo:                       # Dispersion campaign (milestone 4)
  # 1-sigma dispersions, truncated at +/-3 sigma; every generated run is
  # clamped to physical guardrails. The flight configuration keeps the
  # NOMINAL engine model — engine dispersion is a calibration mismatch
  # the control loops must absorb (allowed tolerance: 10%).
  default_run_count: 200           # CI flies 300
  sigmas:
    gate_altitude_m: 100.0
    gate_horizontal_velocity_mps: 5.0
    gate_vertical_velocity_mps: 3.0
    gate_pitch_deg: 2.9            # 0.05 rad
    dry_mass_kg: 5.0
    propellant_mass_kg: 5.0
    engine_max_thrust_n: 50.0      # 2% engine performance
    specific_impulse_s: 3.0
    imu_accel_bias_mps2: 0.01      # Around the nominal 0.02 bias; drawn
                                   # independently per accelerometer axis
    nav_handover_altitude_m: 5.0   # Filter seed error, zero-centered
    nav_handover_velocity_mps: 1.0 # Filter seed error, zero-centered
    nav_handover_downrange_m: 10.0 # Horizontal seed error, zero-centered
    nav_handover_velocity_x_mps: 1.0 # Horizontal seed error, zero-centered
  hazards:                         # Terrain-hazard dispersion (milestone 6)
    hazard_probability: 0.5        # Fraction of runs with a zone near the site
    zone_length_m: 60.0
    center_offset_sigma_m: 40.0    # Zone placement around the nominal site

hazard_avoidance:                  # Milestone 6 (src/hda/safe_site_selector.hpp)
  # Mission limits the flight selector enforces per candidate site; a
  # site's whole footprint (min_safe_site_radius_m) must be surveyed and
  # uniformly inside the limits.
  max_site_slope_deg: 10.0
  max_roughness_m: 0.30
  # The footprint must budget for the landing dispersion: the vehicle
  # lands where NAVIGATION thinks the site is (milestone 7), so the
  # verified radius has to absorb the touchdown position error (< 8 m
  # worst case in the 500-run campaign). The original 4 m footprint
  # demonstrably put diverted landings onto adjacent hazards once the
  # horizontal channel flew on estimated state.
  min_safe_site_radius_m: 10.0
  max_divert_distance_m: 300.0
  # SIL survey geometry (sim/src/approach_sim.hpp): a one-shot terrain
  # scan at the decision gate; station spacing must not exceed the
  # footprint radius or no site can prove its neighborhood surveyed.
  scan_altitude_m: 1000.0
  survey_halfwidth_m: 300.0
  sample_spacing_m: 4.0
  # SIL base terrain (sim/src/terrain_model.hpp); hazard zones are laid
  # on top per scenario (and randomly by the Monte-Carlo campaign).
  base_slope_deg: 2.0
  base_roughness_m: 0.05
