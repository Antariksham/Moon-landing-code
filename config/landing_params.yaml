# Project SELENE — mission & vehicle parameters (technology demonstrator).
# Values here are PLACEHOLDERS for SIL development, not flight-tuned.
# Any change to this file requires a closed-loop SIL regression run.

mission:
  target_body: moon
  gravity_mps2: 1.625              # Lunar surface gravity
  landing_site:
    latitude_deg: -84.5            # Notional south-pole region site
    longitude_deg: 31.2
    elevation_m: 0.0

vehicle:
  dry_mass_kg: 280.0
  propellant_mass_kg: 320.0
  main_engine:
    # 2500 N keeps min-throttle thrust (750 N) below lunar weight at all
    # vehicle masses, so a steady terminal descent is physically possible.
    # (The earlier 4500 N placeholder violated this: 0.3 * 4500 = 1350 N
    # exceeds the ~975 N lunar weight — the vehicle could never descend at
    # constant rate with the engine lit.)
    max_thrust_n: 2500.0
    min_throttle_frac: 0.30        # Deep-throttle floor
    max_throttle_frac: 1.00
    specific_impulse_s: 310.0

  attitude:
    pitch_inertia_kgm2: 450.0      # Pitch-axis moment of inertia
    max_rcs_torque_nm: 400.0       # RCS couple at command = +/-1

control:
  loop_rate_hz: 50
  descent_rate_pid:                # See src/gnc/control/pid_controller.hpp
    # 1-DOF sim only. The PID outputs a throttle CORRECTION around the
    # mass-feedforward hover throttle (m*g / T_max); the engine model
    # enforces the real [min_throttle, 1.0] band. See sim/src/descent_sim.cpp.
    kp: 0.8
    ki: 0.15
    kd: 0.05
    # +/-0.7 spans the full engine band around hover (~0.36-0.39), so hot
    # gates can command maximum thrust.
    output_min: -0.70
    output_max: 0.70
    integrator_min: -0.20
    integrator_max: 0.20

  # 3-DOF approach loops (see sim/src/approach_sim.cpp). The velocity
  # loops output thrust ACCELERATION commands (m/s^2) that the thrust
  # allocator turns into pitch + throttle; the attitude loop outputs an
  # RCS torque fraction in [-1, 1].
  horizontal_velocity_pid:
    kp: 0.40
    ki: 0.02
    kd: 0.0
    # +/-2.0 m/s^2 keeps the commanded tilt inside the allocator's pitch
    # authority at all vertical-channel commands.
    output_min: -2.0
    output_max: 2.0
    integrator_min: -0.30
    integrator_max: 0.30
  vertical_velocity_pid:
    # Correction around the gravity feedforward (1.625 m/s^2).
    kp: 1.50
    ki: 0.30
    kd: 0.0
    # +/-2.5 m/s^2 spans the engine's net-acceleration band around hover
    # (max net accel is ~2.9 m/s^2 at full tanks).
    output_min: -2.5
    output_max: 2.5
    integrator_min: -0.50
    integrator_max: 0.50
  attitude_pid:
    # PD design: derivative-on-measurement provides pure rate damping;
    # no integral term (nothing to trim in vacuum flight).
    kp: 5.0
    ki: 0.0
    kd: 4.5
    output_min: -1.0
    output_max: 1.0
    integrator_min: -0.10
    integrator_max: 0.10
  thrust_allocator:                # See src/gnc/control/thrust_allocator.hpp
    max_pitch_deg: 45.0            # Attitude authority for translation loops

navigation:                        # Vertical channel (milestone 3)
  vertical_nav_filter:             # src/gnc/navigation/vertical_nav_filter.hpp
    # 2-state Kalman filter: IMU-acceleration predict at the control
    # rate, radar-altimeter update at the sensor rate. The initial state
    # is seeded from the approach gate plus the handover errors below.
    initial_altitude_std_m: 10.0
    initial_velocity_std_mps: 2.0
    accel_noise_std_mps2: 0.1      # Process noise driver
    altimeter_noise_std_m: 0.2     # Measurement noise (R)
    innovation_gate_sigma: 5.0     # Reject returns beyond this many sigma
  handover_error:                  # Filter seed error vs. truth at the gate
    altitude_m: 5.0
    velocity_mps: 1.0
  sensors:                         # SIL error models (sim/src/sensor_models.hpp)
    imu_accel_noise_std_mps2: 0.05 # White noise per 50 Hz sample
    imu_accel_bias_mps2: 0.02      # Constant turn-on bias (unestimated)
    altimeter_noise_std_m: 0.2     # White noise per return
    altimeter_rate_hz: 10          # Return every 5th control cycle

approach:                          # 3-DOF handover gate (milestone 2)
  gate_altitude_m: 2000.0
  gate_horizontal_velocity_mps: 60.0
  gate_vertical_velocity_mps: -30.0
  gate_pitch_deg: -17.2            # Braking attitude (thrust against travel)
  # Guidance pitch-over schedule (src/gnc/guidance/descent_guidance.hpp):
  # allowed ground speed shrinks linearly with altitude and reaches zero
  # at the pitch-over altitude, forcing a vertical terminal descent.
  pitchover_altitude_m: 150.0
  horizontal_rate_slope_hz: 0.03   # (m/s of ground speed) per m of altitude
  max_horizontal_rate_mps: 80.0

terminal_descent:
  target_descent_rate_mps: 1.0     # Constant-velocity final segment
  touchdown_velocity_limit_mps: 2.0
  touchdown_horizontal_limit_mps: 1.0
  touchdown_tilt_limit_deg: 5.0
  engine_cutoff_altitude_m: 0.5

hazard_avoidance:
  max_site_slope_deg: 10.0
  max_roughness_m: 0.30
  min_safe_site_radius_m: 4.0
  max_divert_distance_m: 300.0
